name: 버그 신고 / Bug report
description: 모바일 앱에서 생긴 문제를 알려 주세요. / Report a problem in the mobile app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        기능 요청과 PR은 받지 않습니다. 버그 신고만 받습니다. 보안 문제는 이슈로 올리지 말고 [SECURITY.md](https://github.com/AquilaXk/maum-on-mobile/blob/main/SECURITY.md)의 비공개 신고를 이용해 주세요.

        Feature requests and pull requests are not accepted. Only bug reports are. Do not file security problems here; use the private report described in [SECURITY.md](https://github.com/AquilaXk/maum-on-mobile/blob/main/SECURITY.md).

  - type: dropdown
    id: module
    attributes:
      label: 모듈 / Module
      options:
        - 홈·대시보드 / Home & Dashboard
        - 일기·감정 히트맵 / Diary & Mood Heatmap
        - 스토리·댓글 / Stories & Comments
        - 비밀편지 / Letters
        - AI 상담 / Consultation
        - 알림·신고 / Notifications & Reports
        - 인증·설정 / Auth & Settings
        - 기타 / Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 운영체제 / OS
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS 버전 / OS version
      placeholder: "예: Android 15, iOS 18.4"
    validations:
      required: true

  - type: dropdown
    id: install-channel
    attributes:
      label: 설치 경로 / Install channel
      options:
        - Google Play
        - TestFlight / App Store
        - 로컬 빌드 / Local build
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 앱 버전 / App version
      placeholder: "예: 0.1.0+1"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차 / Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 / Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과 / Actual result
      description: 화면 캡처나 오류 문구를 붙여 주세요. / Add screenshots or error messages.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 / Checklist
      options:
        - label: 첨부한 내용에 토큰, 개인정보, 기밀 정보가 없습니다. / The report contains no tokens, personal data, or confidential secrets.
          required: true
        - label: 최신 버전에서 다시 확인했습니다. / I confirmed the problem on the latest version.
          required: true
